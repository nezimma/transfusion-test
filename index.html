<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трансфузиология Тест</title>
<style>
/* Black and white, large type, one column. Markers: circle = one answer, square = several answers */
:root{--bg:#fff;--fg:#000;--muted:#333;color-scheme:light;--font:Arial,'Helvetica Neue',Helvetica,sans-serif}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:20px;line-height:1.4;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-weight:700;font-size:1.6rem;line-height:1.2;margin:0}
.sub{color:var(--muted);margin:0}
.variants{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vbtn{background:var(--bg);border:3px solid var(--fg);border-radius:8px;padding:18px 12px;font:inherit;color:var(--fg);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.vbtn b{font-size:1.2rem}
.vbtn span{font-size:.85rem}
button:focus-visible{outline:4px solid var(--fg);outline-offset:3px}
.top{display:flex;align-items:center;gap:12px}
.back{background:none;border:0;color:var(--fg);font:inherit;font-size:.9rem;text-decoration:underline;padding:6px 0;cursor:pointer}
.bar{flex:1;height:10px;border:2px solid var(--fg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);width:0}
.cnt{font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap}
.q{font-size:1.3rem;line-height:1.3;font-weight:700;margin:0}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:2px solid var(--fg);border-radius:8px;padding:16px 14px;font:inherit;color:var(--fg);cursor:pointer;min-width:0}
.opt .l{flex:none;width:28px;height:28px;border:3px solid var(--fg);background:var(--bg);display:grid;place-items:center;font-size:1rem;font-weight:700;color:var(--fg);margin-top:1px;line-height:1}
.opt.radio .l{border-radius:50%}
.opt.check .l{border-radius:4px}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-width:4px;padding:14px 12px}
.opt.sel .l{background:var(--fg);box-shadow:inset 0 0 0 4px var(--bg)}
.opt.ok{background:var(--fg);color:var(--bg)}
.opt.ok .l{background:var(--bg);color:var(--fg);box-shadow:none;border-color:var(--bg)}
.opt.bad{border-style:dashed;border-width:4px;padding:14px 12px;text-decoration:line-through}
.opt.bad .l{box-shadow:none;background:var(--bg);color:var(--fg)}
.opt[disabled]{cursor:default}
.verdict{border:4px solid var(--fg);border-radius:8px;padding:12px 14px;font-weight:700;font-size:1.1rem}
.verdict small{display:block;font-weight:400;font-size:.9rem;margin-top:4px}
.cta{background:var(--fg);color:var(--bg);border:3px solid var(--fg);border-radius:8px;padding:16px;font:inherit;font-weight:700;cursor:pointer;width:100%}
.cta.alt{background:var(--bg);color:var(--fg)}
.cta[disabled]{background:var(--bg);color:#777;border-color:#777;border-style:dashed;cursor:default}
.score{font-size:3.2rem;font-weight:700;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.review li{display:flex;gap:10px;align-items:baseline;font-size:.9rem;padding:8px 0;border-bottom:1px solid var(--fg)}
.review b{flex:none;width:2ch;font-variant-numeric:tabular-nums}
.review .m{flex:none;font-weight:700}
.review span.s{min-width:0;overflow-wrap:anywhere}
</style>

</head>

{q:"Тромбоцитарный компонент крови (ТКК) хранят:",o:["в холодильнике при температуре +4…+8 °C не более 48 часов","при температуре не выше +18 °C не более 48 часов в тромбомиксере","при температуре 22 ± 2 °C в тромбомиксере от 24 часов до 7 суток в зависимости от условий заготовки и качества контейнеров","в холодильнике при температуре +4…+8 °C не более 24 часов"],a:[2]}
],
4:[
{q:"Документ, регламентирующий порядок медицинского применения крови и (или) ее компонентов в организациях здравоохранения:",o:["постановление МЗ РБ № 92","постановление МЗ РБ № 80","постановление МЗ РБ № 90","постановление МЗ РБ № 82"],a:[0]},
{q:"Процент людей с резус-положительной кровью составляет приблизительно:",o:["15 %","85 %","50 %","99 %"],a:[1]},
{q:"Флаконы с кровью IV группы маркируются полосой:",o:["бесцветной","красной","желтой","синей"],a:[2]},

{q:"Для О (I) группы крови характерно:",o:["наличие на эритроцитах антигена А, в сыворотке – анти-В антител","наличие на эритроцитах антигена В, в сыворотке – анти-А антитела","отсутствие на эритроцитах А и В антигенов, наличие в сыворотке – анти-А и анти-В антител","наличие на эритроцитах антигенов А и В, отсутствие в сыворотке антител"],a:[2]},

{q:"В каких случаях ставится «Контроль специфичности» при определении группы крови системы АВО с помощью моноклональных антител на плоскости:",o:["в случае, когда произошла агглютинация и с анти-А, и с анти-В моноклонами","в случае, когда нигде не произошла агглютинация","в любом случае"],a:[0]},

]};
var app=document.getElementById('app');
var st=null;

function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild}
function esc(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function same(a,b){return a.length===b.length&&a.every(function(x){return b.indexOf(x)>-1})}

function home(){
  st=null; app.innerHTML='';
  app.appendChild(el('<div style="display:flex;flex-direction:column;gap:8px"><h1>Основные вопросы клинической трансфузиологии</h1><p class="sub">Выберите вариант.</p></div>'));
  var g=el('<div class="variants"></div>');
  [1,2,3,4].forEach(function(v){
    var b=el('<button class="vbtn"><b>Вариант '+v+'</b><span>'+DATA[v].length+' вопросов</span></button>');
    b.onclick=function(){start(v,DATA[v].map(function(_,i){return i}))};
    g.appendChild(b);
  });
  app.appendChild(g);
  var all=el('<button class="cta alt">Все варианты вперемешку (40 вопросов)</button>');
  all.onclick=function(){
    var ids=[];[1,2,3,4].forEach(function(v){DATA[v].forEach(function(_,i){ids.push(v+':'+i)})});
    for(var i=ids.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ids[i];ids[i]=ids[j];ids[j]=t}
    start(0,ids);
  };
  app.appendChild(all);
}

function qOf(id){
  if(st.v) return DATA[st.v][id];
  var p=String(id).split(':');return DATA[p[0]][+p[1]];
}

function start(v,ids){
  st={v:v,ids:ids,i:0,res:[],sel:[],done:false};
  render();
}

function render(){
  var q=qOf(st.ids[st.i]), multi=q.a.length>1, n=st.ids.length;
  app.innerHTML='';
  var top=el('<div class="top"><button class="back">← Меню</button><div class="bar"><i></i></div><span class="cnt">'+(st.i+1)+' из '+n+'</span></div>');
  top.querySelector('.back').onclick=home;
  top.querySelector('.bar i').style.width=(st.i/n*100)+'%';
  app.appendChild(top);
  app.appendChild(el('<h2 class="q">'+esc(q.q)+'</h2>'));
  if(multi) app.appendChild(el('<p class="hint">Несколько верных ответов. Отметьте все, что считаете верными.</p>'));
  var box=el('<div class="opts"></div>');
  var btn=el('<button class="cta">Продолжить</button>');
  btn.disabled=true;
  var btns=q.o.map(function(t,k){
    var b=el('<button class="opt '+(multi?'check':'radio')+'"><span class="l"></span><span class="t">'+esc(t)+'</span></button>');
    b.onclick=function(){
      if(st.done) return;
      if(multi){
        var p=st.sel.indexOf(k);
        if(p>-1)st.sel.splice(p,1);else st.sel.push(k);
        b.classList.toggle('sel');
      } else {
        st.sel=[k];
        btns.forEach(function(x){x.classList.remove('sel')});
        b.classList.add('sel');
      }
      btn.disabled=!st.sel.length;
    };
    box.appendChild(b);return b;
  });
  app.appendChild(box);
  btn.onclick=function(){
    if(!st.done){ reveal(q,btns,btn,box); return; }
    if(st.i===st.ids.length-1){result()}else{st.i++;st.sel=[];st.done=false;render()}
  };
  app.appendChild(btn);
  window.scrollTo(0,0);
}

function reveal(q,btns,btn,box){
  st.done=true;
  var ok=same(st.sel,q.a);
  st.res.push(ok);
  btns.forEach(function(b,k){
    b.disabled=true;b.classList.remove('sel');
    var right=q.a.indexOf(k)>-1, chosen=st.sel.indexOf(k)>-1, m=b.querySelector('.l');
    if(right){b.classList.add('ok');m.textContent='✓'}
    else if(chosen){b.classList.add('bad');m.textContent='✗'}
  });
  var det=ok?'':'<small>Верные ответы отмечены чёрным цветом и знаком ✓. Ваш неверный ответ перечёркнут и отмечен знаком ✗.</small>';
  var v=el('<div class="verdict">'+(ok?'✓ Верно':'✗ Неверно')+det+'</div>');
  app.insertBefore(v,btn);
  btn.textContent=(st.i===st.ids.length-1)?'Показать результат':'Далее';
  v.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function result(){
  var n=st.ids.length, c=st.res.filter(Boolean).length;
  app.innerHTML='';
  app.appendChild(el('<div style="display:flex;flex-direction:column;gap:6px"><p class="sub">Результат</p><p class="score">'+c+' из '+n+'</p><p class="sub">'+Math.round(c/n*100)+'% верных ответов</p></div>'));
  var bad=[];
  var ul=el('<ul class="review"></ul>');
  st.ids.forEach(function(id,i){
    var q=qOf(id), ok=st.res[i];
    if(!ok)bad.push(id);
    var ans=q.a.map(function(k){return q.o[k]}).join('; ');
    ul.appendChild(el('<li><b>'+(i+1)+'</b><span class="m">'+(ok?'✓':'✗')+'</span><span class="s">'+esc(q.q)+'<br><span class="hint">'+esc(ans)+'</span></span></li>'));
  });
  if(bad.length){
    var r=el('<button class="cta">Повторить ошибки ('+bad.length+')</button>');
    var v=st.v;
    r.onclick=function(){start(v,bad)};
    app.appendChild(r);
  }
  var again=el('<button class="cta alt">В меню</button>');
  again.onclick=home;
  app.appendChild(again);
  app.appendChild(ul);
  window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
