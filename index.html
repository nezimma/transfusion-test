<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трансфузиология Тест</title>
<style>
/* Layout: single narrow column, one question per screen, sticky progress bar on top */
:root{
  --bg:#f6f3f2; --card:#ffffff; --fg:#241b1d; --muted:#76696c; --line:#e3dbd9;
  --accent:#9b1c31; --accent-fg:#ffffff;
  --ok:#17794a; --ok-bg:#e1f4ea; --bad:#b3261e; --bad-bg:#fbe6e4; --miss-bg:#fff3d6; --miss:#8a5a00;
  --display:'Newsreader',Georgia,serif; --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171213; --card:#221b1d; --fg:#f2eaeb; --muted:#a39598; --line:#3a2f32;
  --accent:#e0566c; --accent-fg:#1a0d10;
  --ok:#59d197; --ok-bg:#12301f; --bad:#ff8a80; --bad-bg:#3a1714; --miss-bg:#38290a; --miss:#f0c060; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171213; --card:#221b1d; --fg:#f2eaeb; --muted:#a39598; --line:#3a2f32;
  --accent:#e0566c; --accent-fg:#1a0d10;
  --ok:#59d197; --ok-bg:#12301f; --bad:#ff8a80; --bad-bg:#3a1714; --miss-bg:#38290a; --miss:#f0c060; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:19px;line-height:1.45;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:600;font-size:1.7rem;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.variants{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 12px;font:inherit;color:var(--fg);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.vbtn b{font-family:var(--display);font-size:1.3rem}
.vbtn span{color:var(--muted);font-size:.85rem}
.vbtn:active{border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px}
.back{background:none;border:0;color:var(--muted);font:inherit;padding:6px 0;cursor:pointer}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.cnt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap}
.q{font-family:var(--display);font-size:1.3rem;line-height:1.3;font-weight:600;margin:0;text-wrap:pretty}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:16px 14px;font:inherit;color:var(--fg);cursor:pointer;min-width:0}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.8rem;font-weight:600;color:var(--muted);margin-top:1px}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent)}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.ok .l{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .l{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.opt.miss{background:var(--miss-bg);border-color:var(--miss)}
.opt.miss .l{border-color:var(--miss);color:var(--miss)}
.opt[disabled]{cursor:default}
.verdict{border-radius:10px;padding:12px 14px;font-weight:600}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict small{display:block;font-weight:400;color:var(--fg);margin-top:2px}
.cta{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:14px;font:inherit;font-weight:600;cursor:pointer;width:100%}
.cta.alt{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.cta[disabled]{opacity:.4;cursor:default}
.score{font-family:var(--display);font-size:3.2rem;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.review li{display:flex;gap:10px;align-items:baseline;font-size:.95rem;padding:8px 0;border-bottom:1px solid var(--line)}
.review b{flex:none;width:2ch;font-variant-numeric:tabular-nums}
.review .m{flex:none;font-weight:700}
.review .m.ok{color:var(--ok)}.review .m.bad{color:var(--bad)}
.review span.s{min-width:0;overflow-wrap:anywhere}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Onest:wght@400;600&display=swap">

</head>

var LET="АБВГ";
var app=document.getElementById('app');
var st=null;

function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild}
function esc(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function same(a,b){return a.length===b.length&&a.every(function(x){return b.indexOf(x)>-1})}

function home(){
  st=null; app.innerHTML='';
  app.appendChild(el('<div style="display:flex;flex-direction:column;gap:6px"><h1>Основные вопросы клинической трансфузиологии</h1><p class="sub">Выберите вариант. После ответа сразу видно, верно или нет.</p></div>'));
  var g=el('<div class="variants"></div>');
  [1,2,3,4].forEach(function(v){
    var b=el('<button class="vbtn"><b>Вариант '+v+'</b><span>'+DATA[v].length+' вопросов</span></button>');
    b.onclick=function(){start(v,DATA[v].map(function(_,i){return i}))};
    g.appendChild(b);
  });
  app.appendChild(g);
  var all=el('<button class="cta alt">Все варианты вперемешку (40 вопросов)</button>');
  all.onclick=function(){
    var ids=[];[1,2,3,4].forEach(function(v){DATA[v].forEach(function(_,i){ids.push(v+':'+i)})});
    for(var i=ids.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ids[i];ids[i]=ids[j];ids[j]=t}
    start(0,ids);
  };
  app.appendChild(all);
}

function qOf(id){
  if(st.v) return DATA[st.v][id];
  var p=String(id).split(':');return DATA[p[0]][+p[1]];
}

function start(v,ids){
  st={v:v,ids:ids,i:0,res:[],sel:[],done:false};
  render();
}

function render(){
  var q=qOf(st.ids[st.i]), multi=q.a.length>1, n=st.ids.length;
  app.innerHTML='';
  var top=el('<div class="top"><button class="back">← Меню</button><div class="bar"><i></i></div><span class="cnt">'+(st.i+1)+' / '+n+'</span></div>');
  top.querySelector('.back').onclick=home;
  top.querySelector('.bar i').style.width=(st.i/n*100)+'%';
  app.appendChild(top);
  app.appendChild(el('<h2 class="q">'+(st.v?'':'')+esc(q.q)+'</h2>'));
  if(multi) app.appendChild(el('<p class="hint">Несколько верных ответов. Отметьте все и нажмите «Проверить».</p>'));
  var box=el('<div class="opts"></div>');
  var btns=q.o.map(function(t,k){
    var b=el('<button class="opt"><span class="l">'+LET[k]+'</span><span class="t">'+esc(t)+'</span></button>');
    b.onclick=function(){
      if(st.done) return;
      if(multi){
        var p=st.sel.indexOf(k);
        if(p>-1)st.sel.splice(p,1);else st.sel.push(k);
        b.classList.toggle('sel');
        chk.disabled=!st.sel.length;
      } else { st.sel=[k]; finish(q,btns,box); }
    };
    box.appendChild(b);return b;
  });
  app.appendChild(box);
  var chk=el('<button class="cta">Проверить</button>');
  chk.disabled=true;
  chk.onclick=function(){finish(q,btns,box)};
  if(multi) app.appendChild(chk);
  window.scrollTo(0,0);
}

function finish(q,btns,box){
  st.done=true;
  var ok=same(st.sel,q.a);
  st.res.push(ok);
  btns.forEach(function(b,k){
    b.disabled=true;b.classList.remove('sel');
    var right=q.a.indexOf(k)>-1, chosen=st.sel.indexOf(k)>-1;
    if(right&&chosen)b.classList.add('ok');
    else if(chosen)b.classList.add('bad');
    else if(right)b.classList.add(ok?'ok':'miss');
  });
  var txt=ok?'Верно':'Неверно';
  var det='';
  if(!ok){det='Правильно: '+q.a.map(function(k){return LET[k]}).join(', ')}
  var v=el('<div class="verdict '+(ok?'ok':'bad')+'">'+txt+(det?'<small>'+det+'</small>':'')+'</div>');
  var last=st.i===st.ids.length-1;
  var nx=el('<button class="cta">'+(last?'Показать результат':'Дальше')+'</button>');
  nx.onclick=function(){
    if(last){result()}else{st.i++;st.sel=[];st.done=false;render()}
  };
  var anchor=app.querySelector('.cta');
  if(anchor)anchor.remove();
  app.appendChild(v);app.appendChild(nx);
  v.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function result(){
  var n=st.ids.length, c=st.res.filter(Boolean).length;
  app.innerHTML='';
  app.appendChild(el('<div style="display:flex;flex-direction:column;gap:6px"><p class="sub">Результат</p><p class="score">'+c+' из '+n+'</p><p class="sub">'+Math.round(c/n*100)+'% верных ответов</p></div>'));
  var bad=[];
  var ul=el('<ul class="review"></ul>');
  st.ids.forEach(function(id,i){
    var q=qOf(id), ok=st.res[i];
    if(!ok)bad.push(id);
    var ans=q.a.map(function(k){return LET[k]+') '+q.o[k]}).join('; ');
    ul.appendChild(el('<li><b>'+(i+1)+'</b><span class="m '+(ok?'ok':'bad')+'">'+(ok?'✓':'✗')+'</span><span class="s">'+esc(q.q)+'<br><span class="hint">'+esc(ans)+'</span></span></li>'));
  });
  if(bad.length){
    var r=el('<button class="cta">Повторить ошибки ('+bad.length+')</button>');
    var v=st.v;
    r.onclick=function(){start(v,bad)};
    app.appendChild(r);
  }
  var again=el('<button class="cta alt">В меню</button>');
  again.onclick=home;
  app.appendChild(again);
  app.appendChild(ul);
  window.scrollTo(0,0);
}
home();
</script>

</body>
</html>
